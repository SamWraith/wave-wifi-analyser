name: Linux validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev libnl-3-dev libnl-genl-3-dev python3
      - name: Install repository-pinned Flutter
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          test "$version" = 3.47.5
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Inspect Linux toolchain
        run: flutter doctor -v
      - name: Analyze, test and build complete release bundle
        run: ./tool/linux/validate.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave-wifi-analyser-linux-x64
          path: dist/wave-wifi-analyser-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
