name: Prepare desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          git clone --depth 1 --branch $version https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed.' }
          (Join-Path $sdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate and package Windows x64
        run: ./tool/windows/validate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/wave-wifi-analyser-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev libnl-3-dev libnl-genl-3-dev python3
      - name: Install pinned Flutter
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Validate and package Linux x64
        run: ./tool/linux/validate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/wave-wifi-analyser-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare draft with validated desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          if gh release view "$tag" --json isDraft > /tmp/wave-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/wave-release.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "Wave $version — desktop preview" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/wave-wifi-analyser-windows-x64.zip dist/wave-wifi-analyser-linux-x64.tar.gz --clobber
          echo 'Draft only. Add signed Android APK, macOS package and final SHA256SUMS before publishing.' >> "$GITHUB_STEP_SUMMARY"
