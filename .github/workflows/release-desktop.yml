name: Prepare desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          git clone --depth 1 --branch $version https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed.' }
          if ((git -C $sdk rev-parse HEAD) -ne (Get-Content tool/flutter-revision -Raw).Trim()) { throw 'Flutter revision mismatch.' }
          (Join-Path $sdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate and package Windows x64
        run: ./tool/windows/validate.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/wave-wifi-analyser-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-13-dev libnl-3-dev libnl-genl-3-dev python3
      - name: Install pinned Flutter
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = "$(cat tool/flutter-revision)"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Validate and package Linux x64
        run: ./tool/linux/validate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: dist/wave-wifi-analyser-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare draft with validated desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          # Require an existing immutable version tag at this workflow's source.
          remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')
          if [[ "$tag_type" == tag ]]; then
            remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag" --jq '.object.sha')
          fi
          test "$remote_tag" = "$GITHUB_SHA"
          if gh release view "$tag" --json isDraft,targetCommitish > /tmp/wave-release.json 2>/dev/null; then
            python3 -c 'import json,os; r=json.load(open("/tmp/wave-release.json")); assert r["isDraft"], "Refusing to replace a published release"; assert r["targetCommitish"] == os.environ["GITHUB_SHA"], "Existing draft source differs; review manually"'
          else
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --draft --prerelease --title "Wave $version — desktop preview" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/wave-wifi-analyser-windows-x64.zip dist/wave-wifi-analyser-linux-x64.tar.gz --clobber
          echo 'Draft only. Add verified release-signed Android APK and final SHA256SUMS before publishing. Omit macOS until Developer ID signing, notarization and native launch pass.' >> "$GITHUB_STEP_SUMMARY"
