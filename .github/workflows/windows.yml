name: Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install repository-pinned Flutter
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          if ($version -ne '3.47.5') { throw 'Review Windows workflow when changing Flutter pin.' }
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          git clone --depth 1 --branch $version https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK checkout failed.' }
          if ((git -C $sdk rev-parse HEAD) -ne (Get-Content tool/flutter-revision -Raw).Trim()) { throw 'Flutter revision mismatch.' }
          (Join-Path $sdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Inspect Windows toolchain
        run: flutter doctor -v
      - name: Analyze, test and build complete release bundle
        run: ./tool/windows/validate.ps1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave-wifi-analyser-windows-x64
          path: dist/wave-wifi-analyser-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
